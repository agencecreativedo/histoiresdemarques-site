<style>
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/bricolage.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"DM Mono";src:url(fonts/dmmono-500.woff2) format("woff2");font-weight:500;font-display:swap}
:root{
  --bleu:#2e68b9;--creme:#faf3e5;--jaune:#fed222;--rouge:#f44d37;--vert:#389d43;--rose:#fd6e9f;--encre:#0b0b0c;--blanc:#fff;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:linear-gradient(var(--bleu) 50%,var(--creme) 50%)}
body{min-height:100vh;min-height:100dvh;background:var(--bleu);color:var(--creme);font-family:var(--display);display:flex;flex-direction:column;align-items:center;overflow-x:hidden;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:440px;padding:56px 16px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;flex:1}

.avatar{width:132px;height:132px;border-radius:50%;background:var(--jaune);border:5px solid var(--encre);overflow:hidden;animation:pop .6s cubic-bezier(.34,1.56,.64,1) both}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
h1{margin-top:20px;font-weight:800;font-size:clamp(34px,10vw,44px);line-height:.95;letter-spacing:-.03em;color:var(--blanc)}
h1 span{display:inline-block;background:var(--jaune);color:var(--encre);border:4px solid var(--encre);border-radius:12px;padding:2px 12px 6px;margin-top:8px;transform:rotate(-2deg)}
.accroche{margin-top:18px;font-weight:500;font-size:18px;line-height:1.35;max-width:320px;color:var(--creme)}
.rythme{margin-top:14px;font-family:var(--mono);font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--encre);background:var(--creme);border:3px solid var(--encre);border-radius:999px;padding:4px 14px}

nav{width:100%;margin-top:32px;display:flex;flex-direction:column;gap:16px}
.lien{display:flex;align-items:center;gap:14px;width:100%;padding:12px 18px 12px 12px;background:var(--creme);color:var(--encre);border:4px solid var(--encre);border-radius:16px;text-decoration:none;box-shadow:0 6px 0 var(--encre);transition:transform .12s ease,box-shadow .12s ease;animation:monte .5s cubic-bezier(.34,1.56,.64,1) both}
.lien:nth-child(1){animation-delay:.12s}.lien:nth-child(2){animation-delay:.2s}.lien:nth-child(3){animation-delay:.28s}
.lien:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--encre)}
.lien:active{transform:translateY(5px);box-shadow:0 1px 0 var(--encre)}
.lien:focus-visible{outline:4px solid var(--jaune);outline-offset:4px}
.pastille{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--encre);display:grid;place-items:center}
.pastille svg{width:26px;height:26px;fill:var(--encre)}
.tiktok .pastille{background:var(--jaune)}
.insta .pastille{background:var(--rose)}
.youtube .pastille{background:var(--rouge)}
.texte{flex:1;text-align:left;min-width:0}
.texte strong{display:block;font-weight:800;font-size:21px;line-height:1.1;letter-spacing:-.01em}
.texte small{display:block;margin-top:3px;font-family:var(--mono);font-weight:500;font-size:13px;color:#4a4640;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fleche{flex:none;width:22px;height:22px;stroke:var(--encre);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* La rue */
.bas{position:relative;width:100%;overflow:hidden;display:flex;justify-content:center;margin-top:8px}
.bas .sol{position:absolute;left:0;right:0;bottom:0;height:24px;background:var(--creme);border-top:4px solid var(--encre)}
.rue{position:relative;width:100%;max-width:900px;height:210px;pointer-events:none}
.rue img{position:absolute;bottom:22px;height:auto}
.f1{left:-2%;width:30%}
.lamp{left:24%;width:8%}
.fc{left:30%;width:40%}
.arbre{right:6%;width:20%}
.f2{right:-6%;width:24%;z-index:0}
.leo{left:50%;width:15%;transform:translateX(-50%);bottom:14px!important;z-index:2;animation:salut 2.8s ease-in-out 1s infinite}
.anita{left:9%;width:12%;bottom:14px!important;z-index:2}
.enzo{right:12%;width:13%;bottom:14px!important;z-index:2}
.fleur{width:9%;bottom:18px!important;z-index:3}
.fl1{left:36%}.fl2{right:30%}

footer{width:100%;background:var(--creme);color:var(--encre);text-align:center;font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:0 16px 22px;margin-top:-1px}

@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes monte{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes salut{0%,100%{transform:translateX(-50%) rotate(0)}50%{transform:translateX(-50%) rotate(-3deg) translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){main{padding-top:72px}.rue{height:300px}}
</style>
</head>
<body>
<main>
  <div class="avatar"><img src="img/avatar.webp" alt="Léopold, le personnage du compte" width="132" height="132"></div>
  <h1>Histoires<br><span>de marques</span></h1>
  <p class="accroche">Les histoires vraies derrière les marques qu'on connaît tous.</p>
  <p class="rythme">Une histoire par jour</p>

  <nav aria-label="Nos réseaux">

      <span class="texte"><strong>TikTok</strong><small>@histoiresdemarques</small></span>

      <span class="pastille" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 7.3a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm6-7.9a1.1 1.1 0 1 1-2.2 0 1.1 1.1 0 0 1 2.2 0zM12 2.5c-2.6 0-2.9 0-3.9.1-3.5.2-5.4 2.1-5.6 5.6-.1 1-.1 1.3-.1 3.9s0 2.9.1 3.9c.2 3.5 2.1 5.4 5.6 5.6 1 .1 1.3.1 3.9.1s2.9 0 3.9-.1c3.5-.2 5.4-2.1 5.6-5.6.1-1 .1-1.3.1-3.9s0-2.9-.1-3.9c-.2-3.5-2.1-5.4-5.6-5.6-1-.1-1.3-.1-3.9-.1zm0 1.7c2.5 0 2.8 0 3.8.1 2.6.1 3.8 1.3 3.9 3.9.1 1 .1 1.3.1 3.8s0 2.8-.1 3.8c-.1 2.6-1.3 3.8-3.9 3.9-1 .1-1.3.1-3.8.1s-2.8 0-3.8-.1c-2.6-.1-3.8-1.3-3.9-3.9-.1-1-.1-1.3-.1-3.8s0-2.8.1-3.8c.1-2.6 1.3-3.8 3.9-3.9 1-.1 1.3-.1 3.8-.1z"/></svg></span>
      <span class="texte"><strong>Instagram</strong><small>@histoiresdemarques.fr</small></span>
      <svg class="fleche" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <a class="lien youtube" href="https://www.youtube.com/@histoiresdemarques" target="_blank" rel="noopener">
      <span class="pastille" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2 26 26 0 0 0 2 12a26 26 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.8 1.8c1.6.4 7.8.4 7.8.4s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8A26 26 0 0 0 22 12a26 26 0 0 0-.4-4.8zM10 15V9l5.2 3L10 15z"/></svg></span>
      <span class="texte"><strong>YouTube</strong><small>@histoiresdemarques</small></span>
      <svg class="fleche" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </nav>
</main>
